<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>تواصل معانا</title>
<link rel="icon" href="icon.svg">
<style>
  :root{--bg:#f6f1e8;--card:#fffdf8;--ink:#2a2118;--muted:#7a6a58;--gold:#a8742e;--line:#e7dccb;--shadow:0 18px 50px -24px rgba(80,55,20,.35)}
  @media (prefers-color-scheme:dark){:root{--bg:#16120d;--card:#211b14;--ink:#f3eadc;--muted:#b3a38d;--gold:#d9a45a;--line:#3a3024;--shadow:0 18px 50px -24px rgba(0,0,0,.7)}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Tajawal","Cairo",Tahoma,system-ui,sans-serif}
  body{display:flex;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 16px 32px;background:
    radial-gradient(1200px 500px at 50% -200px,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),var(--bg)}
  main{width:100%;max-width:420px}
  .head{text-align:center;margin:18px 0 26px}
  .mark{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .mark svg{width:38px;height:38px;color:var(--gold)}
  h1{margin:0;font-size:28px;letter-spacing:.2px}
  .sub{margin:8px 0 0;color:var(--muted);font-size:15px}
  .list{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:17px;font-weight:600;box-shadow:var(--shadow);transition:transform .15s ease}
  a.btn:active{transform:scale(.98)}
  a.btn .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
  a.btn .ic svg{width:22px;height:22px}
  a.btn small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px;direction:ltr;text-align:right}
  a.btn .go{margin-inline-start:auto;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
    <h1 id="name">أهلًا بيك</h1>
    <p class="sub">شكرًا إنك اخترتنا — تابعنا وكلّمنا من هنا</p>
  </div>
  <div class="list" id="list"></div>
  <footer>نورتنا 🤍</footer>
</main>
<script>
(function () {
  "use strict";
  var ICONS = {
    wa: ['#25D366', '<path fill="currentColor" d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 000-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.3c0-.1-.2-.2-.5-.3z"/>'],
    phone: ['#3b7ddd', '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/>'],
    fb: ['#1877F2', '<path fill="currentColor" d="M14 8h3V4h-3a5 5 0 00-5 5v2H7v4h2v7h4v-7h3l1-4h-4V9a1 1 0 011-1z"/>'],
    ig: ['#d6249f', '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>'],
    maps: ['#ea4335', '<path fill="currentColor" d="M12 2a7 7 0 00-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1114.5 9 2.5 2.5 0 0112 11.5z"/>'],
    web: ['#8a6a3c', '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>']
  };
  function decode(h) {
    try { var s = h.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch (e) { return null; }
  }
  // only plain https links and digit-only phone numbers are ever turned into buttons
  function https(u) { if (!u || typeof u !== "string") return null; var x = /^https?:\/\//i.test(u) ? u : "https://" + u; try { var p = new URL(x); return p.protocol === "https:" || p.protocol === "http:" ? p.href : null; } catch (e) { return null; } }
  function digits(p) { var d = String(p || "").replace(/[^0-9+]/g, ""); return d.length >= 7 && d.length <= 16 ? d : null; }
  function wa(p) { var d = String(p).replace(/[^0-9]/g, ""); if (/^01\d{9}$/.test(d)) d = "2" + d; return d; }
  function btn(kind, label, sub, href, external) {
    var a = document.createElement("a"); a.className = "btn"; a.href = href; if (external) { a.target = "_blank"; a.rel = "noopener"; }
    var ic = document.createElement("span"); ic.className = "ic"; ic.style.background = ICONS[kind][0];
    ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[kind][1] + "</svg>";
    var t = document.createElement("span"); t.textContent = label; if (sub) { var s = document.createElement("small"); s.textContent = sub; t.appendChild(s); }
    var go = document.createElement("span"); go.className = "go"; go.textContent = "‹";
    a.appendChild(ic); a.appendChild(t); a.appendChild(go); return a;
  }
  var d = decode(location.hash.slice(1)) || {}, list = document.getElementById("list"), n = 0;
  if (d.n) { document.getElementById("name").textContent = String(d.n).slice(0, 60); document.title = String(d.n).slice(0, 60) + " — تواصل معانا"; }
  var p;
  if ((p = digits(d.a))) { list.appendChild(btn("wa", "واتساب", p, "https://wa.me/" + wa(p), true)); n++; }
  if ((p = digits(d.p))) { list.appendChild(btn("phone", "اتصل بينا", p, "tel:" + p, false)); n++; }
  if ((p = https(d.f))) { list.appendChild(btn("fb", "فيسبوك", null, p, true)); n++; }
  if ((p = https(d.i))) { list.appendChild(btn("ig", "إنستجرام", null, p, true)); n++; }
  if ((p = https(d.m))) { list.appendChild(btn("maps", "مكاننا على الخريطة", null, p, true)); n++; }
  if ((p = https(d.w))) { list.appendChild(btn("web", "موقعنا", null, p, true)); n++; }
  if (!n) { var e = document.createElement("div"); e.className = "empty"; e.textContent = "اللينك ده ناقص — اسأل المحل على الكود الصحيح."; list.appendChild(e); }
})();
</script>
</body>
</html>
